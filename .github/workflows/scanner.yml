name: IDX Scanner

on:
  schedule:
    - cron: "0 4 * * 1-5"   # 11:00 WIB
    - cron: "0 10 * * 1-5"  # 17:00 WIB
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: idx-scanner
  cancel-in-progress: false

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner
        env:
          RUN_ONLY_OPEN_SESSION: "false"
          SCANNER_OUTPUT_FILE: "alert.csv"
          SCANNER_LOG_FILE: "scanner.log"
          TICKER_FILE: "stocks.txt"
          SECTOR_FILE: "sectors.csv"
          YF_PERIOD: "6mo"
          YF_INTERVAL: "1d"
          MAX_TICKERS: "0"
          RETRY_COUNT: "4"
          BASE_BACKOFF: "2.5"
          SLEEP_EVERY: "1"
          SLEEP_SECONDS: "6"
          JITTER_SECONDS: "2"
        run: python scanner.py

      - name: Show output preview
        if: always()
        run: |
          echo "=== alert.csv ==="
          if [ -f alert.csv ]; then
            sed -n '1,40p' alert.csv
          else
            echo "alert.csv not found"
          fi
          echo "=== scanner.log tail ==="
          if [ -f scanner.log ]; then
            tail -n 80 scanner.log
          else
            echo "scanner.log not found"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-artifacts
          path: |
            scanner.log
            alert.csv

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alert.csv scanner.log
          git diff --cached --quiet || git commit -m "Update scanner outputs"
          git push
