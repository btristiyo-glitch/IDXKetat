name: Indonesian Market Scanner

on:
  schedule:
    - cron: '55 1 * * 1-5'   # 08:55 WIB
    - cron: '05 2 * * 1-5'   # 09:05 WIB
    - cron: '15 2 * * 1-5'   # 09:15 WIB
    - cron: '30 2 * * 1-5'   # 09:30 WIB
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanner-idx
  cancel-in-progress: false

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Validate Telegram env
        run: |
          python - <<'PY'
          import os
          token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          chat  = os.getenv("TELEGRAM_CHAT_ID", "").strip()
          print("TOKEN_OK =", bool(token))
          print("CHAT_OK =", bool(chat))
          if not token or not chat:
              raise SystemExit("Missing Telegram secrets in GitHub Actions")
          PY

      - name: Run scanner
        run: python scanner.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-logs
          path: |
            scanner.log
            alert.csv
